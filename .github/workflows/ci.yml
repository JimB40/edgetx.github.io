name: Deploy website review preview
on:
  push:
    branches: [website-3.0]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: website-review-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'JimB40/edgetx.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/configure-pages@v5
      - run: mkdocs build --clean
      - name: Verify preview indexing protection
        run: python tools/check-preview.py site
      - name: Verify local links and assets
        run: python tools/check-links.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy review site
        id: deployment
        uses: actions/deploy-pages@v4
